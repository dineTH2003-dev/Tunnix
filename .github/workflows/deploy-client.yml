name: Deploy Client (Amplify)

on:
  push:
    branches:
      - prod
    paths:
      - 'apps/client/**'
      - 'package.json'
      - 'bun.lock'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Trigger Amplify Build
        run: |
          aws amplify start-job \
            --app-id ${{ secrets.AMPLIFY_APP_ID }} \
            --branch-name prod \
            --job-type RELEASE

      - name: Wait for Amplify deployment
        run: |
          echo "Amplify deployment triggered. Check AWS Amplify console for status."
          echo "App ID: ${{ secrets.AMPLIFY_APP_ID }}"
