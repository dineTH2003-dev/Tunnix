name: Build & Upload Agent Binaries

on:
  push:
    branches:
      - prod
    paths:
      - 'agent/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: agent/go.sum

      - name: Build agent binaries
        run: |
          chmod +x scripts/build-agents.sh
          ./scripts/build-agents.sh
        # Output: dist/agents/tunnix-{os}-{arch}[.exe]

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Upload agents to S3 (versioned)
        run: |
          aws s3 cp dist/agents/ \
            s3://${{ secrets.S3_AGENT_BINARIES_BUCKET }}/agents/${{ github.sha }}/ \
            --recursive

      - name: Upload agents to S3 (latest)
        run: |
          aws s3 cp dist/agents/ \
            s3://${{ secrets.S3_AGENT_BINARIES_BUCKET }}/agents/latest/ \
            --recursive

      - name: Summary
        run: |
          echo "Agent binaries uploaded:"
          ls -lh dist/agents/
          echo ""
          echo "S3 paths:"
          echo "  s3://${{ secrets.S3_AGENT_BINARIES_BUCKET }}/agents/${{ github.sha }}/"
          echo "  s3://${{ secrets.S3_AGENT_BINARIES_BUCKET }}/agents/latest/"
