name: Infrastructure (Terraform)

on:
  push:
    branches:
      - prod
    paths:
      - 'infra/**'
  pull_request:
    branches:
      - prod
    paths:
      - 'infra/**'
  workflow_dispatch:

env:
  TF_WORKING_DIR: infra/terraform

jobs:
  validate:
    name: Validate Infrastructure
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive

      - name: Terraform Init (Validation Mode)
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Infrastructure Safety Guard
        run: |
          echo "=========================================================="
          echo "✅ Infrastructure syntax and configuration verified!"
          echo "🛡️  Automatic resource creation/apply is disabled."
          echo "   Your live deployment is untouched and safe."
          echo "=========================================================="
