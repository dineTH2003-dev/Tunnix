# Tunnix AWS Production Nginx Configuration
# HTTP only -- add SSL when you attach a domain
#
# To add SSL later:
#   1. Point your domain's A record to this EC2 Elastic IP
#   2. Run: sudo certbot --nginx -d yourdomain.com -d *.yourdomain.com
#   3. Replace the server_name values below with your real domain
#
# Ports used by containers (ECS on EC2):
#   4310 -- Tunnix server (control plane API)
#   8080 -- Go gateway (HTTP tunnel ingress)
#   9000 -- Go gateway (agent WebSocket)

# ─── 1. Wildcard Subdomain Ingress → Go Gateway HTTP ──────────────────────────
# Handles tunnel traffic: <subdomain>.tunnix.local → gateway:8080
# When you have a real domain, change server_name to: ~^(?<subdomain>.+)\.yourdomain\.com$
server {
    listen 80;
    server_name ~^(?<subdomain>.+)\.tunnix\.local$;

    client_max_body_size 100M;

    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    3600s;
    }
}

# ─── 2. Control Plane — API + Agent WebSocket ──────────────────────────────────
# Catches all other traffic (EC2 IP or api.yourdomain.com in future)
server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 50M;

    # Agent WebSocket → gateway:9000
    location /tunnel-ws {
        proxy_pass         http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "Upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # REST API → server:4310
    location /v1/ {
        proxy_pass         http://127.0.0.1:4310;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Health check → server:4310
    location /health {
        proxy_pass http://127.0.0.1:4310/health;
    }

    # Default
    location / {
        return 200 'Tunnix API Server\nVisit your Amplify URL for the dashboard.\n';
        add_header Content-Type text/plain;
    }
}
