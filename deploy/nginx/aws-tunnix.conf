# Tunnix AWS Production Nginx Configuration
# HTTP only -- add SSL when you attach a domain
#
# To add SSL later:
#   1. Point your domain's A record to this EC2 Elastic IP
#   2. Run: sudo certbot --nginx -d yourdomain.com -d *.yourdomain.com
#   3. Replace the server_name values below with your real domain
#
# Ports used by containers (ECS on EC2):
#   4310 -- Tunnix server (control plane API)
#   8080 -- Go gateway (HTTP tunnel ingress)
#   9000 -- Go gateway (agent WebSocket)

# ─── 1. Wildcard Subdomain Ingress → Go Gateway HTTP ──────────────────────────
# Handles tunnel traffic: <subdomain>.47.130.245.232.sslip.io OR <subdomain>.tunnix.local → gateway:8080
server {
    listen 80;
    server_name ~^(?<subdomain>[a-zA-Z0-9_-]+)\.47\.130\.245\.232\.sslip\.io$ ~^(?<subdomain>[a-zA-Z0-9_-]+)\.tunnix\.local$;

    client_max_body_size 100M;

    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Subdomain $subdomain;
        proxy_connect_timeout 10s;
        proxy_read_timeout    3600s;
    }
}

# ─── 2. HTTP Control Plane (Port 80) ───────────────────────────────────────────
server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 50M;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Agent WebSocket → gateway:9000
    location /v1/tunnel/ws {
        proxy_pass         http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "Upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /tunnel-ws {
        proxy_pass         http://127.0.0.1:9000/v1/tunnel/ws;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "Upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # REST API → server:4310
    location /v1/ {
        proxy_pass         http://127.0.0.1:4310;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Health check → server:4310
    location /health {
        proxy_pass http://127.0.0.1:4310/health;
    }

    # Default
    location / {
        return 200 'Tunnix API Server\nVisit your Amplify URL for the dashboard.\n';
        add_header Content-Type text/plain;
    }
}

# ─── 3. HTTPS Control Plane (Port 443) with Let's Encrypt SSL ────────────────
server {
    listen 443 ssl default_server;
    server_name 47.130.245.232.sslip.io _;

    ssl_certificate     /etc/letsencrypt/live/47.130.245.232.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/47.130.245.232.sslip.io/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 50M;

    # Agent WebSocket → gateway:9000
    location /v1/tunnel/ws {
        proxy_pass         http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "Upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /tunnel-ws {
        proxy_pass         http://127.0.0.1:9000/v1/tunnel/ws;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "Upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # REST API → server:4310
    location /v1/ {
        proxy_pass         http://127.0.0.1:4310;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }

    # Health check → server:4310
    location /health {
        proxy_pass http://127.0.0.1:4310/health;
    }

    # Default
    location / {
        return 200 'Tunnix API Server (HTTPS)\nVisit your Amplify URL for the dashboard.\n';
        add_header Content-Type text/plain;
    }
}
