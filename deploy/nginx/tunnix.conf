# Tunnix Production Nginx Configuration

# 1. Public Wildcard Subdomain Ingress (*.tunnix.local -> Gateway HTTP Server)
server {
    listen 80;
    listen 443 ssl http2;
    server_name *.tunnix.local;

    ssl_certificate /etc/letsencrypt/live/tunnix.local/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tunnix.local/privkey.pem;

    client_max_body_size 100M;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 2. Main Platform Control Plane & Dashboard (tunnix.local)
server {
    listen 80;
    listen 443 ssl http2;
    server_name tunnix.local;

    ssl_certificate /etc/letsencrypt/live/tunnix.local/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tunnix.local/privkey.pem;

    root /var/www/tunnix/client/dist;
    index index.html;

    client_max_body_size 50M;

    # Agent WebSocket Proxy
    location /v1/tunnel/ws {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # API Proxy
    location /v1/ {
        proxy_pass http://127.0.0.1:4310;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health Check Proxy
    location /health {
        proxy_pass http://127.0.0.1:4310/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Client SPA Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
